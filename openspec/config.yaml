schema: spec-driven

context: |
  Проект: ToxicBot — Telegram-бот на Go. Правила проекта, стек, структура, команды сборки и тестов,
  переменные окружения и известные грабли — в AGENTS.md в корне репозитория. Читай его, не пересказывай
  здесь и не дублируй в артефактах.

  Руководство по работе с этим контуром — SDD.md в корне репозитория.

  Язык артефактов — русский. Структурные заголовки OpenSpec (Requirement, Scenario, ADDED/MODIFIED/REMOVED)
  и ключевые слова RFC 2119 (SHALL, MUST, SHOULD, MAY) остаются английскими.

  Каждый сценарий обязан иметь стабильный идентификатор в заголовке:
  #### Scenario: [PREFIX-NNN] краткое описание случая
  Префикс задан в capability.yaml рядом со spec.md. Номера не переиспользуются после удаления сценария.

rules:
  proposal:
    - "Обязателен раздел «Что не меняем» — границы изменения."
    - "Не пересказывать AGENTS.md и не копировать содержимое design.md."
    - "Если затронуты промпты, sanitize, вероятности, миграции или формат таблиц — это полный режим, дельта обязательна."
  specs:
    - "Только наблюдаемое поведение. Имена типов, функций, пакетов и структура кода — не сюда."
    - "Каждый Scenario получает идентификатор [PREFIX-NNN] и запись в capability.yaml."
    - "MODIFIED-требование переносится целиком, а не диффом, иначе archive потеряет контекст."
    - "Новый или изменённый сценарий обязан быть covered или manual с причиной; перевод в todo запрещён."
  design:
    - "Только когда решение неочевидно: что выбрали, какие альтернативы отклонили и почему."
    - "Для локальных правок не создавать вовсе."
  tasks:
    - "Отдельными пунктами: тесты, разметка якорей // spec:, обновление capability.yaml, archive."
    - "Не дробить на микрошаги, не имеющие смысла для ревью."

operations:
  apply:
    guidance:
      - "Изменение наблюдаемого поведения начинается с дельты, а не с кода."
      - "Появилось новое допущение о поведении — сначала правится change, потом код."
  archive:
    guidance:
      - "Архивировать в той же ветке до merge, иначе труба прогонится лишний раз, а дельты забудутся."
      - "Перед archive прогнать make spec-check и go test ./..."
